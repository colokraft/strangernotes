<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Notes</title>

    <style>
        body {
            margin: 0;
            background: white;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #bild {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <img id="bild" alt="">

    <script>
        let bilder = [];
        let aktuellesBild = -1;

        fetch("bildliste.txt")
            .then(response => response.text())
            .then(text => {
                bilder = text.split("\n")
                    .map(name => name.trim())
                    .filter(name => name !== "");

                naechstesBild();
            });

        function naechstesBild() {
            if (bilder.length === 0) return;

            let neuesBild;

            do {
                neuesBild = Math.floor(Math.random() * bilder.length);
            } while (neuesBild === aktuellesBild && bilder.length > 1);

            aktuellesBild = neuesBild;

            document.getElementById("bild").src =
                "bilder/" + bilder[aktuellesBild];
        }

        document.body.addEventListener("click", naechstesBild);
    </script>
</body>
</html>
